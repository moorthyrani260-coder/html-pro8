```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Box Design</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f0eaff;
    margin: 25px;
}

h1 {
    color: purple;
    text-align: center;
}

.box {
    width: 350px;
    height: 220px;
    background-color: #e1bee7;
    border: 4px solid #7b1fa2;
    padding: 25px;
    margin: 40px auto;
    border-radius: 15px;
}

p {
    font-size: 17px;
    color: #333333;
    line-height: 1.5;
}

.highlight {
    color: white;
    background-color: #6a1b9a;
    padding: 12px;
    border-radius: 5px;
}
</style>
</head>

<body>

<h1>CSS Box Model and Colors</h1>

<div class="box">
    <p>
        This box demonstrates CSS properties such as
        width, height, padding, margin, and border.
    </p>

    <p class="highlight">
        Explore different colors and measurements using CSS!
    </p>
</div>

</body>
</html>
```
